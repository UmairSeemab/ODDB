ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /srv/oddb/app/public
    <Directory /srv/oddb/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
